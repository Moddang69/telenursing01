server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # รองรับ React Router (SPA) — ทุก path ที่ไม่เจอไฟล์จริงให้ fallback ไป index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker / manifest ต้องไม่ถูก cache นาน — ไม่งั้นผู้ใช้จะไม่ได้รับโค้ดแจ้งเตือน (Web Push) เวอร์ชันใหม่
    # (location แบบ = มีลำดับเหนือกว่า regex ด้านล่าง จึงไม่โดนกฎ cache 30 วัน)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Cache Static Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}