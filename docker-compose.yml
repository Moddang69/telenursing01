version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: telenursing-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: telenursing_prototype_db
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - telenursing-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telenursing-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/telenursing_prototype_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 30m
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      BCRYPT_SALT_ROUNDS: 12
    ports:
      - '5000:5000'
    networks:
      - telenursing-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: telenursing-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    networks:
      - telenursing-net

networks:
  telenursing-net:
    driver: bridge

volumes:
  mongo_data:
